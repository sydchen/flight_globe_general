<title>城市間最短航線｜3D 比較</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030b17;color:#eff6ff}
#view{position:fixed;inset:0;cursor:grab}#view:active{cursor:grabbing}canvas{display:block}
.top{position:absolute;left:clamp(20px,5vw,72px);top:clamp(18px,4vh,48px);pointer-events:none;z-index:2}.eyebrow{color:#89a7c2;font-size:11px;font-weight:750;letter-spacing:.21em}.top h1{font-size:clamp(22px,2.65vw,39px);margin:10px 0 8px;letter-spacing:.015em;font-weight:800}.top p{margin:0;color:#adc0d1;font-size:13px}
.selector{position:absolute;top:145px;left:clamp(20px,5vw,72px);z-index:5;display:flex;gap:9px;flex-wrap:wrap;max-width:620px}.selector label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:#adc0d1}.selector select{background:#10243c;color:#fff;border:1px solid #ffffff50;border-radius:8px;padding:9px 8px;font-size:13px;min-width:148px;max-width:205px}.selector select:focus{outline:2px solid #65d6f0}.panel{position:absolute;bottom:clamp(20px,4.5vh,46px);left:clamp(20px,5vw,72px);z-index:2;max-width:460px;width:calc(100% - 40px);padding:20px 22px;border:1px solid #ffffff22;border-radius:17px;background:linear-gradient(130deg,#102039db,#07172fc9);backdrop-filter:blur(16px);box-shadow:0 12px 50px #0005;pointer-events:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}.city{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}.dot{width:9px;height:9px;border-radius:50%;flex:none}.blue{background:#40dafa;box-shadow:0 0 13px #40dafa}.orange{background:#ffbc70;box-shadow:0 0 13px #ffbc70}.value{font-variant-numeric:tabular-nums;font-size:14px;font-weight:800}.bar{height:4px;background:#ffffff20;border-radius:20px;overflow:hidden;margin:-4px 0 17px 19px}.bar>div{height:100%;width:0;border-radius:20px;transition:width .08s linear}.bar-blue{background:#40dafa}.bar-orange{background:#ffbc70}.divider{height:1px;background:#ffffff24;margin:4px 0 14px}.bottom{display:flex;align-items:center;justify-content:space-between;color:#a8bbd0;font-size:12px}.bottom strong{color:#fff;font-size:14px}.hint{position:absolute;right:clamp(20px,5vw,72px);bottom:clamp(24px,5vh,55px);font-size:12px;color:#c2d1e2;z-index:2;pointer-events:none;text-align:right}.tag{position:absolute;transform:translate(-50%,-50%);z-index:2;padding:5px 8px;border:1px solid #ffffff30;border-radius:7px;background:#061627bf;white-space:nowrap;font-size:12px;font-weight:750;pointer-events:none;text-shadow:0 1px 3px #000}.tag span{font-weight:500;opacity:.73;font-size:10px;margin-left:3px}.status{font-size:11px;color:#a8bfd3;margin-top:5px}.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:#65edbf;margin-right:7px;box-shadow:0 0 8px #65edbf}

@media(max-width:680px){.language-switch{top:12px;right:14px}.top{padding-top:38px;max-width:calc(100% - 40px)}.top{top:16px}.top h1{font-size:23px}.selector{top:182px;right:14px;left:14px;gap:6px}.selector label{flex:1;min-width:96px}.selector select{width:100%;min-width:0;font-size:12px;padding:7px 4px}.panel{bottom:16px;padding:15px 16px}.hint{bottom:230px;right:20px;font-size:10px}.tag{font-size:10px;padding:3px 5px}.tag span{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"}}</script>
</head>
<body>
<div id="view"></div>
<nav class="language-switch" aria-label="切換語言"><button type="button" data-language="zh-Hant" lang="zh-Hant" aria-pressed="true">中文</button><button type="button" data-language="en" lang="en" aria-pressed="false">English</button></nav>
<header class="top"><div class="eyebrow">GREAT-CIRCLE FLIGHT COMPARISON</div><h1 data-i18n="heading">城市間最短航線比較</h1><p data-i18n="subtitle">相同速度・同時起飛・地球表面最短航線</p><div class="status"><i class="live"></i><span data-i18n="status">自動播放中 · 拖曳地球查看不同角度</span></div></header>
<div class="selector"><label><span data-i18n="source">出發城市</span><select id="source-select" aria-label="出發城市"></select></label><label><span data-i18n="dest1">藍色目的地</span><select id="dest1-select" aria-label="藍色目的地"></select></label><label><span data-i18n="dest2">橘色目的地</span><select id="dest2-select" aria-label="橘色目的地"></select></label></div><div id="tag-tpe" class="tag"></div><div id="tag-rek" class="tag" style="color:#6ee5ff"></div><div id="tag-lis" class="tag" style="color:#ffc58e"></div>
<section class="panel"><div class="row"><div class="city"><i class="dot blue"></i><span id="name-rek">雷克雅維克</span></div><div class="value" id="rek-num">0 / — km</div></div><div class="bar"><div class="bar-blue" id="rek-bar"></div></div><div class="row"><div class="city"><i class="dot orange"></i><span id="name-lis">里斯本</span></div><div class="value" id="lis-num">0 / — km</div></div><div class="bar"><div class="bar-orange" id="lis-bar"></div></div><div class="divider"></div><div class="bottom"><span id="elapsed">模擬飛行 0 小時 00 分</span><strong id="message">雙機同步起飛</strong></div></section>
<div class="hint"><span data-i18n="controls">滑鼠拖曳旋轉 · 滾輪縮放</span><br><span data-i18n="restart">更改城市即重新計算航線</span></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const R=5.0, ALT=.115, KMH=900, FULL=21, HOLD=2.4;
const CITY_LIST={
 tokyo:{name:'東京',en:'TOKYO',lat:35.6762,lng:139.6503},taipei:{name:'台北',en:'TAIPEI',lat:25.033,lng:121.565},osaka:{name:'大阪',en:'OSAKA',lat:34.6937,lng:135.5023},seoul:{name:'首爾',en:'SEOUL',lat:37.5665,lng:126.978},hongkong:{name:'香港',en:'HONG KONG',lat:22.3193,lng:114.1694},singapore:{name:'新加坡',en:'SINGAPORE',lat:1.3521,lng:103.8198},
 lisbon:{name:'里斯本',en:'LISBON',lat:38.7223,lng:-9.1393},reykjavik:{name:'雷克雅維克',en:'REYKJAVÍK',lat:64.1466,lng:-21.9426},london:{name:'倫敦',en:'LONDON',lat:51.5074,lng:-.1278},paris:{name:'巴黎',en:'PARIS',lat:48.8566,lng:2.3522},madrid:{name:'馬德里',en:'MADRID',lat:40.4168,lng:-3.7038},rome:{name:'羅馬',en:'ROME',lat:41.9028,lng:12.4964},berlin:{name:'柏林',en:'BERLIN',lat:52.52,lng:13.405},newyork:{name:'紐約',en:'NEW YORK',lat:40.7128,lng:-74.006},losangeles:{name:'洛杉磯',en:'LOS ANGELES',lat:34.0522,lng:-118.2437},sydney:{name:'雪梨',en:'SYDNEY',lat:-33.8688,lng:151.2093},auckland:{name:'奧克蘭',en:'AUCKLAND',lat:-36.8485,lng:174.7633},dubai:{name:'杜拜',en:'DUBAI',lat:25.2048,lng:55.2708}};
const translations={
 'zh-Hant':{title:'城市間最短航線｜3D 比較',heading:'城市間最短航線比較',subtitle:'相同速度・同時起飛・地球表面最短航線',status:'自動播放中 · 拖曳地球查看不同角度',source:'出發城市',dest1:'藍色目的地',dest2:'橘色目的地',controls:'滑鼠拖曳旋轉 · 滾輪縮放',restart:'更改城市即重新計算航線',language:'切換語言',departed:'雙機同步起飛',flying:'雙機正在飛行',arrived:'兩架飛機皆已抵達',arrival:name=>name+'已抵達！',elapsed:(hours,minutes)=>`模擬飛行 ${hours} 小時 ${minutes} 分`},
 en:{title:'Shortest Flight Routes | 3D Comparison',heading:'Shortest Flight Routes',subtitle:'Same speed · Same departure time · Shortest routes on Earth',status:'Autoplay · Drag the globe to explore',source:'Departure city',dest1:'Blue destination',dest2:'Orange destination',controls:'Drag to rotate · Scroll to zoom',restart:'Change cities to recalculate routes',language:'Switch language',departed:'Both flights departing',flying:'Both flights in progress',arrived:'Both flights have arrived',arrival:name=>name+' has arrived!',elapsed:(hours,minutes)=>`Flight time: ${hours}h ${minutes}m`}
};
const query=new URLSearchParams(location.search);
let savedLanguage;try{savedLanguage=localStorage.getItem('flight-language')}catch{}
let language=Object.hasOwn(translations,query.get('lang'))?query.get('lang'):Object.hasOwn(translations,savedLanguage)?savedLanguage:'zh-Hant';
const cityName=city=>language==='en'?city.en:city.name;
const ids=['source','dest1','dest2'];const defaults=['tokyo','reykjavik','lisbon'];
const chosen=ids.map((id,i)=>Object.hasOwn(CITY_LIST,query.get(id))?query.get(id):defaults[i]);
ids.forEach((id,i)=>{const select=document.getElementById(id+'-select');for(const key of Object.keys(CITY_LIST)){const option=document.createElement('option');option.value=key;select.append(option)}select.value=chosen[i];select.addEventListener('change',()=>{const next=new URLSearchParams(location.search);ids.forEach(id=>next.set(id,document.getElementById(id+'-select').value));next.set('lang',language);location.search=next.toString()})});
const cities={tpe:CITY_LIST[chosen[0]],rek:CITY_LIST[chosen[1]],lis:CITY_LIST[chosen[2]]};
let flightMinutes=0,flightProgress=null;
function renderFlightText(){
 const copy=translations[language];
 document.getElementById('elapsed').textContent=copy.elapsed(Math.floor(flightMinutes/60),String(flightMinutes%60).padStart(2,'0'));
 document.getElementById('message').textContent=!flightProgress?copy.departed:flightProgress.every(x=>x>=1)?copy.arrived:flightProgress[0]>=1?copy.arrival(cityName(cities.rek)):flightProgress[1]>=1?copy.arrival(cityName(cities.lis)):copy.flying;
}
function applyLanguage(){
 const copy=translations[language];document.documentElement.lang=language;document.title=copy.title;
 document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=copy[el.dataset.i18n]});
 document.querySelector('.language-switch').setAttribute('aria-label',copy.language);
 document.querySelectorAll('[data-language]').forEach(button=>{button.setAttribute('aria-pressed',String(button.dataset.language===language))});
 ids.forEach(id=>{const select=document.getElementById(id+'-select');select.setAttribute('aria-label',copy[id]);for(const option of select.options)option.textContent=cityName(CITY_LIST[option.value])});
 for(const [id,city] of Object.entries(cities)){
  const tag=document.getElementById('tag-'+id);tag.textContent=cityName(city);
  if(language==='zh-Hant'){const english=document.createElement('span');english.textContent=city.en;tag.append(' ',english)}
 }
 document.getElementById('name-rek').textContent=cityName(cities.rek);document.getElementById('name-lis').textContent=cityName(cities.lis);
 renderFlightText();
}
document.querySelectorAll('[data-language]').forEach(button=>button.addEventListener('click',()=>{
 language=button.dataset.language;try{localStorage.setItem('flight-language',language)}catch{}
 const url=new URL(location.href);url.searchParams.set('lang',language);try{history.replaceState(null,'',url)}catch{}
 applyLanguage();
}));
applyLanguage();

const scene=new THREE.Scene();scene.background=new THREE.Color('#030b17');
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,200);camera.position.set(0,7.1,18.5);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;document.getElementById('view').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.05;controls.enablePan=false;controls.minDistance=7.0;controls.maxDistance=32;controls.autoRotate=false;
// Even, neutral illumination keeps coastlines readable as the globe rotates.
scene.add(new THREE.AmbientLight(0xffffff,2.2));const sunlight=new THREE.DirectionalLight(0xffffff,1.6);sunlight.position.set(-8,10,14);scene.add(sunlight);const fill=new THREE.DirectionalLight(0xdcecff,1.2);fill.position.set(7,-3,-9);scene.add(fill);
const earth=new THREE.Mesh(new THREE.SphereGeometry(R,96,64),new THREE.MeshPhongMaterial({color:0xffffff,specular:0x23405b,shininess:12}));scene.add(earth);
// Three.js official open texture. A procedural colored sphere remains visible if the image fails.
new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',t=>{t.colorSpace=THREE.SRGBColorSpace;earth.material.map=t;earth.material.needsUpdate=true;},undefined,()=>{earth.material.color.set('#286092');});
const glow=new THREE.Mesh(new THREE.SphereGeometry(R*1.025,64,48),new THREE.MeshBasicMaterial({color:0x448ad7,transparent:true,opacity:.055,side:THREE.BackSide}));scene.add(glow);
const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(R*1.11,64,48),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,uniforms:{c:{value:new THREE.Color('#347bd8')}},vertexShader:'varying vec3 n;varying vec3 w;void main(){vec4 p=modelMatrix*vec4(position,1.);w=p.xyz;n=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*viewMatrix*p;}',fragmentShader:'uniform vec3 c;varying vec3 n;varying vec3 w;void main(){vec3 v=normalize(cameraPosition-w);float f=pow(1.-abs(dot(normalize(n),v)),3.);gl_FragColor=vec4(c,f*.37);}'}));scene.add(atmosphere);
let seed=7;const rand=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);const stars=[];for(let i=0;i<1650;i++){let a=rand()*Math.PI*2,z=rand()*2-1,r=Math.sqrt(1-z*z),dist=42+rand()*70;stars.push(r*Math.cos(a)*dist,r*Math.sin(a)*dist,z*dist)}const starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.Float32BufferAttribute(stars,3));scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xc1d8fb,size:.095,sizeAttenuation:true,transparent:true,opacity:.68})));
// SphereGeometry maps texture u=(longitude+180)/360 to phi=longitude+180 degrees.
// With a standard world map (Greenwich at u=.5), +X is 0° and -Z is 90° east.
function vec({lat,lng},radius=R){const la=lat*Math.PI/180,lo=lng*Math.PI/180;return new THREE.Vector3(Math.cos(la)*Math.cos(lo),Math.sin(la),-Math.cos(la)*Math.sin(lo)).multiplyScalar(radius)}
const origin=vec(cities.tpe).normalize();const legs=[{id:'rek',city:cities.rek,color:0x40dafa,label:cities.rek.name},{id:'lis',city:cities.lis,color:0xffae59,label:cities.lis.name}];
const common=vec(cities.tpe,R+ALT);
function marker(pos,color){const base=vec(pos,R+.055),normal=base.clone().normalize();const dot=new THREE.Mesh(new THREE.SphereGeometry(.087,18,12),new THREE.MeshBasicMaterial({color}));dot.position.copy(base);scene.add(dot);const halo=new THREE.Mesh(new THREE.TorusGeometry(.135,.014,6,36),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.85}));halo.position.copy(base.clone().addScaledVector(normal,.008));halo.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),normal);scene.add(halo)}
marker(cities.tpe,0xffffff);for(const x of legs)marker(x.city,x.color);
function plane(color){const group=new THREE.Group();const mat=new THREE.MeshBasicMaterial({color,side:THREE.DoubleSide});const shape=new THREE.Shape();shape.moveTo(0,.20);shape.lineTo(-.050,-.08);shape.lineTo(-.18,-.16);shape.lineTo(-.17,-.205);shape.lineTo(0,-.15);shape.lineTo(.17,-.205);shape.lineTo(.18,-.16);shape.lineTo(.05,-.08);shape.lineTo(0,.20);const mesh=new THREE.Mesh(new THREE.ShapeGeometry(shape),mat);group.add(mesh);group.scale.setScalar(1.8);return group}
for(const leg of legs){leg.target=vec(leg.city).normalize();leg.angle=origin.angleTo(leg.target);leg.distance=6371.0088*leg.angle;leg.duration=leg.distance/KMH;document.getElementById(leg.id+'-num').textContent='0 / '+Math.round(leg.distance).toLocaleString('en-US')+' km';leg.axis=new THREE.Vector3().crossVectors(origin,leg.target);if(leg.axis.lengthSq()<1e-12){leg.axis.set(0,1,0).cross(origin);if(leg.axis.lengthSq()<1e-12)leg.axis.set(1,0,0)}leg.axis.normalize();leg.slerp=t=>origin.clone().applyAxisAngle(leg.axis,leg.angle*t).normalize();const points=[];for(let i=0;i<=250;i++){let p=leg.slerp(i/250).multiplyScalar(R+ALT+.035*Math.sin(Math.PI*i/250));points.push(p)}const geo=new THREE.BufferGeometry().setFromPoints(points);leg.line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:leg.color,transparent:true,opacity:.3}));scene.add(leg.line);leg.progressGeo=new THREE.BufferGeometry();leg.progressGeo.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(points.length*3),3));leg.progressLine=new THREE.Line(leg.progressGeo,new THREE.LineBasicMaterial({color:leg.color,transparent:false}));scene.add(leg.progressLine);leg.points=points;leg.plane=plane(leg.color);scene.add(leg.plane)}
// Camera faces the midpoint of both great-circle tracks rather than the Earth equator.
const focus=legs[0].slerp(.45).add(legs[1].slerp(.45)).normalize();camera.position.copy(focus.clone().multiplyScalar(16.5).add(new THREE.Vector3(1.5,3,1.6)));camera.lookAt(0,0,0);controls.update();
function tag(id,pos){const el=document.getElementById('tag-'+id);const p=vec(pos,R+.18);const toCamera=camera.position.clone().normalize();if(p.clone().normalize().dot(toCamera)<.04){el.style.display='none';return}p.project(camera);const x=(p.x*.5+.5)*innerWidth,y=(-p.y*.5+.5)*innerHeight;el.style.display='block';el.style.left=x+'px';el.style.top=y+'px'}
function updatePlane(leg,t){const u=Math.min(t/leg.duration,1);const p=leg.slerp(u).multiplyScalar(R+ALT+.035*Math.sin(Math.PI*u));leg.plane.position.copy(p);const normal=p.clone().normalize();let tangent=leg.axis.clone().cross(normal).normalize();const north=new THREE.Vector3(0,1,0);const right=new THREE.Vector3().crossVectors(north,normal).normalize();if(right.lengthSq()<1e-5)right.set(1,0,0);const up=new THREE.Vector3().crossVectors(normal,right).normalize();const m=new THREE.Matrix4().makeBasis(right,up,normal);leg.plane.quaternion.setFromRotationMatrix(m);const localDir=tangent.clone().applyQuaternion(leg.plane.quaternion.clone().invert());leg.plane.rotateZ(Math.atan2(-localDir.x,localDir.y));leg.plane.visible=u<.999;const idx=Math.max(1,Math.ceil(u*(leg.points.length-1)));const data=leg.progressGeo.attributes.position;for(let i=0;i<=idx;i++){const q=leg.points[i];data.setXYZ(i,q.x,q.y,q.z)}leg.progressGeo.setDrawRange(0,idx+1);data.needsUpdate=true;document.getElementById(leg.id+'-bar').style.width=(u*100)+'%';document.getElementById(leg.id+'-num').textContent=Math.round(leg.distance*u).toLocaleString('en-US')+' / '+Math.round(leg.distance).toLocaleString('en-US')+' km';return u}
let last=performance.now(),elapsed=0;const maxDuration=Math.max(...legs.map(x=>x.duration));function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.1);last=now;elapsed+=dt*maxDuration/FULL;if(elapsed>maxDuration+HOLD)elapsed=0;const u=legs.map(x=>updatePlane(x,elapsed));flightMinutes=Math.floor(Math.min(elapsed,maxDuration)*60);flightProgress=u;renderFlightText();controls.update();tag('tpe',cities.tpe);tag('rek',cities.rek);tag('lis',cities.lis);renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
